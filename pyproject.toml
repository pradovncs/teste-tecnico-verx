[tool.poetry]
name = "yahoo-finance-crawler"
version = "0.1.0"
description = "Yahoo Finance Stock Crawler - Selenium + BeautifulSoup"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
selenium = ">=4.0"
beautifulsoup4 = ">=4.12"
webdriver-manager = ">=4.0"
lxml = ">=5.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
