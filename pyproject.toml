[tool.poetry]
name = "cadesp-crawler"
version = "0.1.0"
description = "Crawler do CADESP (SEFAZ-SP) — consulta pública por CNPJ com captcha via AntiCaptcha"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
playwright = ">=1.40"
beautifulsoup4 = ">=4.12"
lxml = ">=5.0"
anticaptchaofficial = ">=1.0.46"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
